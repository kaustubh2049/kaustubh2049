<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kaustubh Rane — exploring ideas across the software universe</title>
  <desc id="desc">A deep navy starfield with a glowing blue and violet nebula, orbit lines, and a small planet.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#17112f"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#687dff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#687dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#8be9fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8be9fd" stop-opacity=".75"/>
      <stop offset="1" stop-color="#c4a7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#space)"/>
  <ellipse cx="870" cy="147" rx="380" ry="205" fill="url(#nebula)"/>
  <g fill="#d7e3f4">
    <circle cx="83" cy="63" r="1.5"/><circle cx="172" cy="221" r="1"/><circle cx="260" cy="42" r="1.2"/>
    <circle cx="344" cy="251" r="1.4"/><circle cx="470" cy="72" r="1"/><circle cx="548" cy="212" r="1.2"/>
    <circle cx="682" cy="44" r="1.5"/><circle cx="773" cy="251" r="1"/><circle cx="920" cy="54" r="1.2"/>
    <circle cx="1042" cy="229" r="1.5"/><circle cx="1137" cy="99" r="1"/><circle cx="1100" cy="47" r="1.3"/>
    <circle cx="64" cy="161" r="1"/><circle cx="638" cy="132" r=".9"/><circle cx="1007" cy="143" r="1"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="1.2" opacity=".8">
    <ellipse cx="938" cy="151" rx="190" ry="66" transform="rotate(-17 938 151)"/>
    <ellipse cx="938" cy="151" rx="242" ry="91" transform="rotate(-17 938 151)" opacity=".55"/>
  </g>
  <circle cx="1007" cy="112" r="30" fill="#8be9fd" opacity=".18" filter="url(#glow)"/>
  <circle cx="1007" cy="112" r="19" fill="#c4a7ff"/>
  <path d="M989 117c7-12 20-20 36-20 1 0 2 0 3 .2a19 19 0 0 0-37 19Z" fill="#e3dcff" opacity=".75"/>
  <text x="76" y="126" fill="#8be9fd" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5">KAUSTUBH RANE  /  SOFTWARE &amp; AI</text>
  <text x="72" y="184" fill="#f1f5ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="1">Building beyond the ordinary.</text>
  <rect x="76" y="211" width="128" height="3" rx="2" fill="url(#line)"/>
  <text x="76" y="247" fill="#b8c5df" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="1.2">FULL-STACK DEVELOPMENT  ·  ARTIFICIAL INTELLIGENCE  ·  CURIOSITY</text>
</svg>
